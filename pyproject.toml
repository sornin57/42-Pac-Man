[project]
name = "PacMan"
version = "0.1.0"
description = "Pac-Man game"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
	"mazegenerator",
	"pygame",
]

[dependency-groups]
dev = [
	"mypy",
	"flake8",
	"pytest",
	"pyinstaller>=6.22.3",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacman"]

[tool.mypy]
exclude = '(^|/)(\.venv[^/]*|\.cache|build|dist|logs|path)(/|$)'
