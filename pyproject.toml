[project]
name = "PacMan"
version = "0.1.0"
description = "Pac-Man game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"mazegenerator",
]

[dependency-groups]
dev = [
	"mypy",
	"flake8",
	"pytest",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacman"]
